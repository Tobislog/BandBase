name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restart App Service
        run: |
          cd /opt/bandbase
          git remote set-url origin https://github.com/tobislog/bandbase.git
          git pull
          cd /opt/bandbase/backend
          npm install --production
          sudo systemctl restart bandbase.service
