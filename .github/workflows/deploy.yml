name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 1. Absicherung: Prüfen ob die Variablen da sind
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "FEHLER: SERVER_HOST oder SERVER_USER ist nicht gesetzt!"
            exit 1
          fi

          echo "Starte Deployment zu $SERVER_USER@$SERVER_HOST..."

          # 2. Bekannte Hosts akzeptieren (mit explizitem Port 22 für den Tunnel)
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          # 3. Verbindung aufbauen und Befehle auf dem Server ausführen
          ssh -v -p 22 "$SERVER_USER@$SERVER_HOST" << 'EOF'
            # 1. In das Projektverzeichnis wechseln
            cd /opt/bandbase/

            # 2. Neuesten Code von GitHub holen
            git pull origin main

            # 3. Abhängigkeiten installieren & App neu starten 
            npm install --production
            pm2 restart bandbase-backend
          EOF
