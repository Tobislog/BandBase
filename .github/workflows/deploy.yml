name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 1. Absicherung: Prüfen ob die Variablen da sind
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "FEHLER: SERVER_HOST oder SERVER_USER ist nicht gesetzt!"
            exit 1
          fi

          echo "Starte Deployment zu $SERVER_USER@$SERVER_HOST..."

          # 2. Prüfen, ob der SSH-Agent den Key geladen hat
          echo "Prüfe geladene SSH-Keys im Agenten:"
          ssh-add -l

          # 3. Bekannte Hosts akzeptieren
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # 4. Verbindung aufbauen mit erzwungener Key-Nutzung und Verbose-Fehlerausgabe bei Bedarf
          ssh -o IdentitiesOnly=yes -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e
            
            echo "Verbunden! Gehe in das Projektverzeichnis..."
            cd /opt/bandbase/
            
            echo "Hole neuesten Code..."
            git pull origin main
            
            echo "Installiere Abhängigkeiten..."
            npm install --production
            
            echo "Starte App neu..."
            pm2 restart bandbase-backend
            
            echo "Deployment erfolgreich abgeschlossen!"
          EOF
