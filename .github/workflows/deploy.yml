name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 1. Absicherung: Prüfen ob die Variablen da sind
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "FEHLER: SERVER_HOST oder SERVER_USER ist nicht gesetzt!"
            exit 1
          fi

          echo "Starte Deployment zu $SERVER_USER@$SERVER_HOST..."

          # 2. Bekannte Hosts akzeptieren
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # 3. Verbindung aufbauen (ohne -v, um Logs sauber zu halten, dafür mit strict error checking)
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e  # Bricht sofort ab, wenn ein Befehl im Server-Skript fehlschlägt
            
            echo "Verbunden! Gehe in das Projektverzeichnis..."
            cd /opt/bandbase/
            
            echo "Hole neuesten Code..."
            git pull origin main
            
            echo "Installiere Abhängigkeiten..."
            npm install --production
            
            echo "Starte App neu..."
            pm2 restart bandbase-backend
            
            echo "Deployment erfolgreich abgeschlossen!"
          EOF
